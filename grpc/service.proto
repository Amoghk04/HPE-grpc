syntax = "proto3";

package myservice;

// gRPC service
service Greeter {
    rpc SayHello (HelloRequest) returns (HelloReply);

    rpc SayHelloAgain (HelloRequest) returns (HelloReply);
}

service NetworkConfig {
    rpc ConfigureIP (IPConfigRequest) returns (IPConfigResponse);
}

// Add new service for data storage
service DataStorage {
    rpc StoreData (DataItem) returns (StoreResponse);
    rpc GetData (GetDataRequest) returns (DataItem);
    rpc ListData (ListDataRequest) returns (ListDataResponse);
    rpc UpdateData (UpdateDataRequest) returns (DataItem);
}

// request message
message HelloRequest {
    string name = 1;
}

// response message
message HelloReply {
    string message = 1;
}

// Add new messages for data storage
message DataItem {
    string id = 1;
    string name = 2;
    int32 age = 3;
    // Add other fields as needed
}

message GetDataRequest {
    string id = 1;
}

message ListDataRequest {
    // Empty request for now, could add pagination later
}

message ListDataResponse {
    repeated DataItem items = 1;
}

message StoreResponse {
    string message = 1;
    DataItem stored_data = 2;
}

message UpdateDataRequest {
    string id = 1;
    DataItem data = 2;
}

message IPConfigRequest {
    string interface_name = 1;
    bool use_dhcp = 2;

    // Fields used if static configuration is requested.
    string requested_ip = 3;
    string requested_subnet_mask = 4;
    string requested_gateway = 5;
    repeated string requested_dns = 6;
}

message IPConfigResponse {
    string ip_address = 1;
    string subnet_mask = 2;
    string default_gateway = 3;
    repeated string dns_servers = 4;
    string status_message = 5;
}